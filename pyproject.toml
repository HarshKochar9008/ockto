[project]
name = "ockto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31",
    "sentry-sdk[opentelemetry-otlp]>=2.71",
    "temporalio[opentelemetry]>=1.34",
]

[project.scripts]
ockto = "ockto.__main__:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
